# supervizio's overlay: one binary ebuild, eclasses from ::gentoo.
repo-name = supervizio
masters = gentoo
# Manifests carry the distfile hashes and nothing else, unsigned: the git
# history of this repository, written by supervizio/agent's release pipeline,
# is what a sync fetches.
thin-manifests = true
sign-manifests = false
sign-commits = false
use-manifests = strict
manifest-hashes = BLAKE2B SHA512
manifest-required-hashes = BLAKE2B SHA512
eapis-banned = 0 1 2 3 4 5 6 7
